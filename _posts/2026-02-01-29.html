<p>（五岁）</p>

<p>从前，有一个小女孩。有一天，她想要天上的星星和她一起跳舞。她住的楼很高，可是她拿不到星星。她就问妈妈：“妈妈，怎样拿到星星呢？”妈妈说：“我也不知道。”她就问爸爸：“爸爸，怎样拿到星星呢？”爸爸说：“我也不懂。”她就只好自己搭火箭。搭啊搭啊，她就拿到星星了！她拿到星星后就回到家里。家里没有人。爸爸妈妈都出门去了。她就和星星一起跳舞。The End！</p>
