<pre class="wp-block-verse">几片树叶 旋转而下<br />敲在同伴的身上<br />近乎悄无声息<br /><br />宝宝睁大了眼睛<br />惊奇 赞叹<br />左手伸出食指<br />描绘树叶的轨迹<br />右手摊开掌心<br />向上握住 林间的风<br />风笑道<br />沙 沙 沙<br /><br />这静谧的风里<br />热血还太遥远<br />理想不曾萌发<br />绝望与你无关</pre>{% endraw %}
