<p>（五岁）</p>

<p>有一天，粉红喵出门去游乐场玩。它忘了带水壶和书包。它还没有到游乐场的时候，觉得很口渴，可是它没有水喝。它就只好去店里买水。它太口渴了，就把水喝完了。它又买了一瓶水，但是没有书包，它只好拿在手里。它又去买了一个书包，这样就可以把水瓶放进去。它去游乐场玩。后来它累了就回家。妈妈问它：“你今天没有带书包和水壶吗？”粉红喵说：“对呀！可是我买了！”The End!</p>{% endraw %}
