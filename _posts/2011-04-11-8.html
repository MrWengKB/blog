{% raw %}
<p>我是一棵四海漂泊的老树<br>不停地流浪八方，沉默<br>沉默千年，却居无定所<br>我只愿有猎户闻风追来<br>一箭射穿我的胸腔<br>并用他鹰隼般的眼神<br>扫过我如茵的灵魂<br>大笑而去</p>
<p>我是一只盘根错节的野兽<br>牢牢地抓住土地，怒吼<br>怒吼千遍，却动弹不得<br>我只愿有樵夫迷途而来<br>持斧砍断我的身躯<br>并用他树皮般的手<br>数着我血染的年轮<br>大恸而去</p>
{% endraw %}
