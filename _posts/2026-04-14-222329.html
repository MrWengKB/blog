<p>（五岁）</p>

<p>（唱）喵喵灯～星星灯～喵喵吃星星～<br>（说）星星说：“好痛啊！”它就去了医院。<br>星星很热的，为什么喵喵可以吃它呢？因为星星刚才在冰箱里。<br>星星在冰箱里的时候碰到了鱼，所以它就有鱼的味道，好香啊！喵喵闻到了，以为是鱼，就去咬它。<br>星星问：“为什么你咬我？”它很生气。喵喵说：“对不起！我是不小心的。”<br>The End！</p>{% endraw %}
