{% raw %}
<p>我虽身处北纬一度的岛国<br>心里却是一片寒冬<br>几万世纪的冰棱垂下<br>刺伤了满眼的郁郁葱葱</p>
<p>太平洋和印度洋的海风<br>交缠于双眉的皑皑<br>从马六甲吹到苏门答腊<br>卷走了星光，或是未来</p>
<p>我的心没有这热烈的阳光<br>也没有缠绵的雨季<br>我躲在冰川倔强的怀抱<br>将偷窥世界的眼帘放低</p>
<p>传说狮子的城市从未哭泣<br>泪水都染作两鬓霜华<br>我只想走在微曦的小径上<br>偶尔停下采一朵蓝色的花</p>
{% endraw %}
