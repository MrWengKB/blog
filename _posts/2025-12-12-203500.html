{% raw %}
<p>傍晚，一家三口去必胜客吃披萨。五岁的小星星说：&quot;我们现在吃中餐！&quot;</p>

<p>什么？披萨是西餐，时间上也是晚餐。</p>

<p>&quot;为什么呢？&quot;我问。</p>

<p>小星星说：</p>

<blockquote class="wp-block-quote"><p>我们和爷爷奶奶一起吃的是大餐。</p>

<p>我和爸爸妈妈一起吃的是中餐。</p>

<p>我和爸爸、我和妈妈两个人吃是小餐。</p>

<p>我一个人吃是小小餐。</p>

<p>小宝宝吃的是迷你餐。</p>
</blockquote>

<p>原来如此！真有道理。</p>{% endraw %}
