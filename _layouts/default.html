<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% elsif paginator.page > 1 %}第 {{ paginator.page }} 页 - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg class="brand-cat" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="20" y="4" width="24" height="14" rx="2" class="fill"/>
        <rect x="14" y="17" width="36" height="4" rx="2" class="fill"/>
        <path d="M14 30 L12 20 L22 25 Z M50 30 L52 20 L42 25 Z" class="fill"/>
        <ellipse cx="32" cy="38" rx="20" ry="17" class="line"/>
        <circle cx="25" cy="36" r="2" class="fill"/>
        <circle cx="39" cy="36" r="5" class="line thin"/>
        <circle cx="39" cy="36" r="2" class="fill"/>
        <path d="M44 39 Q47 46 45 52" class="line thin"/>
        <path d="M30 43 L32 45 L34 43" class="line thin"/>
        <path d="M6 42 H20 M6 47 L20 45 M58 42 H45 M58 47 L45 45" class="line thin"/>
      </svg>
      <h1 class="brand-title">{{ site.title }}</h1>
    </a>
  </header>
{% include post-nav.html %}

  <main class="content">
{{ content }}
  </main>

  <footer class="colophon">
    <p>© {{ site.time | date: "%Y" }} 喵喵喵老先生 · <a href="{{ site.admin_url }}" rel="nofollow">管理</a></p>
  </footer>
</body>
</html>
